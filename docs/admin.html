<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국법인 접대비 취합 시스템</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 data-i18n="appTitle">중국법인 접대비 취합 시스템</h1>
  <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
    <nav class="nav-links">
      <a href="index.html" data-i18n="backBtn">← 뒤로</a>
    </nav>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKey"></label>
        <input type="password" id="adminKey">
      </div>
      <div>
        <label data-i18n="adminYm"></label>
        <select id="adminYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchBtn" data-i18n="adminFetch"></button>
    </div>

    <h3 data-i18n="adminStatusHeading" style="font-size:15px; margin-top:22px;"></h3>
    <p class="desc" data-i18n="adminFilterHint" style="margin-bottom:6px;"></p>
    <div class="status-grid" id="statusGrid"></div>
    <div class="btn-row" id="filterAllWrap" style="display:none;">
      <button class="btn-secondary" id="filterAllBtn" data-i18n="adminFilterAll"></button>
    </div>

    <div class="summary-bar">
      <div><span data-i18n="totalRows">총 건수</span>: <b id="totalRows">0</b></div>
      <div><span data-i18n="totalCny">총액(CNY 환산)</span>: <b id="totalCny">0</b></div>
    </div>
    <div class="table-wrap">
      <table class="exp-table" id="previewTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="corp"></th>
            <th data-i18n="region"></th>
            <th data-i18n="submitterCol"></th>
            <th data-i18n="colDate"></th>
            <th data-i18n="colCurrency"></th>
            <th data-i18n="colAmount"></th>
            <th data-i18n="colCnyAmount"></th>
            <th data-i18n="colVendor"></th>
            <th data-i18n="colHeadcount"></th>
            <th data-i18n="colNote"></th>
            <th data-i18n="adminPreApprovalCol"></th>
            <th data-i18n="submittedAtCol"></th>
            <th data-i18n="colDelete"></th>
          </tr>
        </thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="downloadBtn" data-i18n="adminDownload"></button>
    </div>
  </div>
</main>
<footer>China Entertainment Expense Collection · YJC / HEUNG-A</footer>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-admin.js"></script>
</body>
</html>
