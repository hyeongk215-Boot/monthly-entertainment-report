<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국법인 접대비 취합 시스템</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("erpTheme") === "dark" ? "dark" : "light");</script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="app-brand" href="index.html"><span class="app-brand-text" data-i18n="moduleName"></span></a>

    <div class="app-nav-label" data-i18n="navSecMain"></div>
    <a class="app-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="app-nav-text" data-i18n="navQuery"></span>
    </a>
    <a class="app-nav-item active" href="submit.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="app-nav-text" data-i18n="navSubmit"></span>
    </a>

    <div class="app-nav-label" data-i18n="navSecAdmin"></div>
    <a class="app-nav-item" href="merge.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 12h-6a6 6 0 0 1-6-6"/><circle cx="18" cy="12" r="3"/></svg>
      <span class="app-nav-text" data-i18n="navMerge"></span>
    </a>
    <a class="app-nav-item" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/></svg>
      <span class="app-nav-text" data-i18n="navAdminShort"></span>
    </a>

    <div class="app-sidebar-foot">
      <button class="app-theme-btn" id="themeToggle" aria-label="theme"></button>
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 data-i18n="appTitle"></h1>
    </header>
<main>
  <div style="display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;">
  <div class="card" style="flex:1 1 600px; min-width:0;">
    <h2 data-i18n="submitHeading">접대비 내역 입력</h2>
    <div class="context-bar" id="contextBar"></div>
    <div class="note-box" id="monthClosedBanner" style="display:none; margin-top:14px; background:var(--danger-bg); border-color:var(--danger); color:var(--danger); font-weight:600;"></div>

    <div id="entryFormArea">
    <div class="table-wrap">
      <table class="exp-table" id="expTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="colDate">일시</th>
            <th data-i18n="colCurrency">단위</th>
            <th data-i18n="colAmount">금액</th>
            <th data-i18n="colCnyAmount">CNY 환산액</th>
            <th data-i18n="colVendor">접대처</th>
            <th data-i18n="colHeadcount">인원수</th>
            <th data-i18n="colNote">비고</th>
            <th data-i18n="colTier">결재구분</th>
            <th data-i18n="colPreApproval">사전승인여부</th>
            <th data-i18n="colProposal">품의서</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" id="addRowBtn" data-i18n="addRow">+ 행 추가</button>
    </div>

    <div class="summary-bar">
      <div><span data-i18n="totalRows">총 건수</span>: <b id="totalRows">0</b></div>
      <div><span data-i18n="totalCny">총액(CNY 환산)</span>: <b id="totalCny">0</b></div>
      <div id="draftSavedAtWrap" style="color:var(--muted); display:none;">
        <span data-i18n="draftSavedAt">마지막 임시저장</span>: <span id="draftSavedAt"></span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="draftSaveBtn" data-i18n="draftSaveBtn">임시저장</button>
      <button class="btn-primary" id="serverSubmitBtn" data-i18n="serverSubmitBtn">① 서버로 최종 제출</button>
      <button class="btn-secondary" id="exportBtn" data-i18n="exportBtn" style="margin-left:auto;">③ 엑셀 파일로 내보내기</button>
    </div>
    <div class="note-box" data-i18n="ruleNote"></div>
    </div>
  </div>

  <div class="card" id="uploadPanelCard" style="flex:0 0 300px; width:300px;">
    <h3 data-i18n="uploadPanelHeading" style="margin-top:0; font-size:16px;"></h3>
    <p class="desc" data-i18n="uploadPanelDesc" style="font-size:12px;"></p>
    <div class="btn-row" style="margin-top:0;">
      <button class="btn-secondary" id="downloadTemplateBtn" data-i18n="downloadTemplateBtn" style="width:100%;"></button>
    </div>
    <div style="margin-top:14px;">
      <label data-i18n="uploadFileLabel" style="font-size:12px;"></label>
      <input type="file" id="uploadFileInput" accept=".xlsx" style="width:100%;">
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="uploadBtn" data-i18n="uploadBtn" style="width:100%;"></button>
    </div>
  </div>
  </div>
    </main>
    <footer>China Entertainment Expense Collection · YJC / HEUNG-A</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <h3 data-i18n="finalConfirmTitle">최종 제출 확인</h3>
    <pre id="confirmBody"></pre>
    <div class="btn-row">
      <button class="btn-secondary" id="confirmNo" data-i18n="confirmNo">취소</button>
      <button class="btn-primary" id="confirmYes" data-i18n="confirmYes">확인, 제출합니다</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-submit.js"></script>
</body>
</html>
